# Heat Pumps Now - Internal Portal System
# Coolify Deployment Configuration

version: '3.8'

services:
  heatpumps-internal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    
    ports:
      - "3004:3004"
    
    environment:
      - NODE_ENV=production
      - PORT=3004
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    restart: unless-stopped
    
    labels:
      - "coolify.managed=true"
      - "coolify.name=heatpumps-internal"
      - "coolify.type=application"
      - "traefik.enable=true"
      - "traefik.http.routers.heatpumps-internal.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.heatpumps-internal.tls=true"
      - "traefik.http.routers.heatpumps-internal.tls.certresolver=letsencrypt"
      - "traefik.http.services.heatpumps-internal.loadbalancer.server.port=3004"